{{ define "main" }}
<p class="intro">{{ site.Params.description }}</p>
<ul class="post-list">
  {{ range site.RegularPages.ByDate.Reverse }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
