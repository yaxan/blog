<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p><a href="{{ "index.xml" | relURL }}">RSS</a></p>
</footer>
{{- if .Store.Get "hasAnim" }}
{{ partial "anim-controls.html" . }}
{{- end }}
</body>
</html>
