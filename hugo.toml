baseURL = "https://yazan.ca/"
locale = "en-US"
title = "Yazan Masoud"

# Keep the site barebones: no taxonomies, no extra page kinds.
disableKinds = ["taxonomy", "term"]

enableRobotsTXT = true

# Feeds and defaults treat only the posts section as content.
mainSections = ["posts"]

[params]
  description = "Lessons from my learnings that are (hopefully) written so anyone can follow along."

[markup]
  # Server-side math: goldmark passes LaTeX through, a render hook turns it
  # into KaTeX HTML at build time. Zero client-side JS.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

  # Trusted, hand-authored content only. Needed so shortcode HTML (e.g. a
  # manim embed) survives the tangent body's RenderString pass.
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    # Class-based highlighting; the palette lives in assets/css/syntax.css
    # so code blocks can follow light/dark mode.
    noClasses = false

[outputs]
  home = ["html", "rss"]
  section = ["html"]
